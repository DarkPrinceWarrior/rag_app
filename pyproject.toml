[project]
name = "rag_app"
version = "0.1.0"
description = "Корпоративный инструмент перевода и анализа документации EN→RU (on-prem, RAG)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3,<0.137",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "arq>=0.28.0",
    "minio>=7.2.20",
    "openai>=2.45.0",
    "httpx>=0.28.1",
    "python-docx>=1.2.0",
    "pypdfium2>=5.10.1,<6",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pillow>=12.3.0",
    "pgvector>=0.5.0",
    "pyjwt[crypto]>=2.13.0",
    "langfuse>=4.14.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sentry-sdk[fastapi]>=2.64.0",
    "matplotlib>=3.11.0",
]

# Тяжёлый GPU-контур парсинга — только на сервере: uv sync --extra parse.
# Воркер вызывает mineru как CLI (subprocess), импортов нет. vllm — для
# hybrid/vlm-движков MinerU (форс-OCR битого cmap), даёт ~10× ускорение vs
# transformers. torch-backend=auto при установке (ABI-совместимость vLLM/CUDA).
[project.optional-dependencies]
parse = [
    # MinerU 3.4.4 пинит vllm <0.22; новые standalone-модели обслуживаются
    # отдельным vLLM 0.25, не смешанным с окружением MinerU.
    "mineru[core,pipeline,vllm]>=3.4.4,<3.5",
    "vllm>=0.21,<0.22",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
    "reportlab>=5.0.0",
    "alembic>=1.18.5",
    "pytest-asyncio>=1.4.0",
    "types-openpyxl>=3.1.5.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
