name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never execute untrusted fork code on the private self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      CI: "true"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      RAG_DATABASE_URL: postgresql+asyncpg://postgres:ci-rls-only@127.0.0.1:55432/rag_rls_test
      RAG_RLS_TEST_ADMIN_URL: postgresql://postgres:ci-rls-only@127.0.0.1:55432/rag_rls_test

    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_PASSWORD: ci-rls-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain and policy preflight
        run: ./scripts/ci.sh preflight

      - name: Sync Python 3.13 environment from uv.lock
        run: ./scripts/ci.sh python-sync

      - name: Prepare isolated PostgreSQL RLS database
        run: ./scripts/ci.sh rls-db

      - name: Backend tests
        run: ./scripts/ci.sh pytest

      - name: Ruff
        run: ./scripts/ci.sh ruff

      - name: Mypy
        run: ./scripts/ci.sh mypy

      - name: Alembic single-head and offline upgrade
        run: ./scripts/ci.sh alembic

      - name: Web install, lint and build
        run: ./scripts/ci.sh web

      - name: Extension install, compile and build
        run: ./scripts/ci.sh extension

      - name: Patch hygiene
        if: always()
        run: git diff --check
