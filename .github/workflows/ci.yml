name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never execute untrusted fork code on the private self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      CI: "true"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain and policy preflight
        run: ./scripts/ci.sh preflight

      - name: Sync Python 3.13 environment from uv.lock
        run: ./scripts/ci.sh python-sync

      - name: Backend tests
        run: ./scripts/ci.sh pytest

      - name: Ruff
        run: ./scripts/ci.sh ruff

      - name: Mypy
        run: ./scripts/ci.sh mypy

      - name: Alembic single-head and offline upgrade
        run: ./scripts/ci.sh alembic

      - name: Web install, lint and build
        run: ./scripts/ci.sh web

      - name: Extension install, compile and build
        run: ./scripts/ci.sh extension

      - name: Patch hygiene
        if: always()
        run: git diff --check
