# Мониторинг (roadmap § 10): Prometheus + Grafana отдельным compose, как Langfuse.
# network_mode: host — API слушает только 127.0.0.1:8100, из bridge-сети
# (host.docker.internal) loopback недоступен; в host-режиме Prometheus скрейпит
# 127.0.0.1:8100 напрямую. Оба сервиса сами привязаны к 127.0.0.1 (не наружу).
# Grafana на :3001 (3000 занят соседним проектом).
name: rag-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prom_data:/prometheus

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    network_mode: host
    environment:
      DATA_SOURCE_NAME: ${RAG_METRICS_POSTGRES_DSN:?задайте read-only DSN для exporter}
    command:
      - --web.listen-address=127.0.0.1:9187

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_ADDR: redis://127.0.0.1:6379
    command:
      - --web.listen-address=127.0.0.1:9121

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.3-4.8.2-distroless
    profiles: [dcgm]
    restart: unless-stopped
    network_mode: host
    gpus: all
    cap_add:
      - SYS_ADMIN
    command:
      - -a
      - 127.0.0.1:9400

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_PASSWORD: ${RAG_GRAFANA_PASSWORD:-grafana-admin-2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prom_data:
  grafana_data:
